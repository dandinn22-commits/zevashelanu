<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>תודה שהשארתם פרטים — הצבע שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Assistant:wght@400;500;600;700&family=Suez+One&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#EDB307;
    --yellow-light:#F6C25F;
    --yellow-pale:#FBE3A8;
    --yellow-dark:#A6720A;
    --yellow-deep:#7A5306;
    --ink:#14181A;
    --ink-soft:#2B2F31;
    --cream:#FDF6EA;
    --cream-deep:#F6E7CC;
    --white:#FFFFFF;
    --line: rgba(20,24,26,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Assistant', sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  h1,h2,.display{
    font-family:'Rubik', sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
  }

  .card{
    width:100%;
    max-width:560px;
    background:var(--white);
    border-radius:28px;
    padding:48px 34px 40px;
    text-align:center;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.7) inset,
      0 16px 0 var(--cream-deep),
      0 34px 70px rgba(20,24,26,0.18);
    animation:pop-in 0.6s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes pop-in{
    0%{opacity:0; transform:translateY(18px) scale(.96);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }

  .logo-wrap{
    position:relative;
    width:104px;
    height:104px;
    border-radius:50%;
    overflow:hidden;
    background:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 26px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.6) inset,
      0 8px 0 var(--yellow-dark),
      0 14px 20px rgba(20,24,26,0.3);
  }
  .logo-wrap img{
    width:113px;height:113px;object-fit:cover;object-position:center;border-radius:50%;
  }

  .check-badge{
    position:relative;
    width:120px;
    height:110px;
    margin:0 auto 22px;
  }
  .check-badge svg.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    filter:drop-shadow(2px 8px 6px rgba(122,83,6,0.35));
  }
  .check-badge svg.mark{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  h1{
    font-size:clamp(24px, 5vw, 30px);
    margin-bottom:14px;
  }
  h1 .accent{color:var(--yellow-deep);}

  .sub{
    font-size:16px;
    font-weight:500;
    color:var(--ink-soft);
    max-width:400px;
    margin:0 auto 34px;
  }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
    margin-bottom:8px;
  }

  .btn-brush{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:230px;
    height:76px;
    text-decoration:none;
    border:none;
    background:none;
    cursor:pointer;
    transition:transform .18s cubic-bezier(.3,1.3,.5,1);
  }
  .btn-brush:nth-child(1){transform:rotate(-1.6deg);}
  .btn-brush:nth-child(2){transform:rotate(1.4deg);}
  .btn-brush:hover{transform:rotate(0deg) translateY(-4px) scale(1.04);}
  .btn-brush:active{transform:rotate(0deg) translateY(1px) scale(0.98);}

  .brush-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    filter:drop-shadow(3px 8px 5px rgba(20,24,26,0.3));
  }

  .brush-label{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-family:'Suez One', serif;
    font-size:15.5px;
    font-weight:400;
    padding:0 16px;
    text-align:center;
    pointer-events:none;
  }
  .btn-brush.fill .brush-label{color:var(--ink);}
  .btn-brush.call .brush-label{color:var(--yellow-light);}

  .mini-icon{width:20px;height:20px;flex-shrink:0;}

  .note{
    margin-top:30px;
    font-size:13px;
    color:var(--ink-soft);
    opacity:0.75;
  }

  @media (max-width:560px){
    .card{padding:38px 22px 32px; border-radius:22px;}
    .cta-row{flex-direction:column; align-items:center; gap:22px;}
    .btn-brush{width:250px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img src="assets/logo.jpg" alt="הצבע שלנו">
  </div>

  <div class="check-badge">
    <svg class="bg" viewBox="0 0 120 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="roughCheck" x="-30%" y="-40%" width="160%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03 0.09" numOctaves="2" seed="9" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F6C25F"/>
          <stop offset="55%" stop-color="#EDB307"/>
          <stop offset="100%" stop-color="#A6720A"/>
        </linearGradient>
      </defs>
      <ellipse cx="60" cy="52" rx="46" ry="38" fill="url(#checkGrad)" filter="url(#roughCheck)"/>
    </svg>
    <svg class="mark" viewBox="0 0 120 100" aria-hidden="true">
      <path d="M38 52 L54 68 L84 34" stroke="#14181A" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>תודה<span class="accent" id="nameSpan"></span>! הפרטים התקבלו בהצלחה</h1>
  <p class="sub">צוות "הצבע שלנו" קיבל את הפנייה שלכם וכבר בודק אותה — ניצור איתכם קשר בהקדם, בדרך כלל תוך שעתיים.</p>

  <div class="cta-row">
    <a href="tel:0537479284" class="btn-brush call" aria-label="התקשרו עכשיו">
      <svg class="brush-bg" viewBox="0 0 230 76" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="roughFillCall2" x="-30%" y="-60%" width="160%" height="220%">
            <feTurbulence type="fractalNoise" baseFrequency="0.025 0.1" numOctaves="2" seed="21" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <linearGradient id="fillGradCall2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2B2F31"/>
            <stop offset="55%" stop-color="#14181A"/>
            <stop offset="100%" stop-color="#000000"/>
          </linearGradient>
        </defs>
        <rect x="16" y="28" width="198" height="20" rx="9" fill="#000000" opacity="0.55" filter="url(#roughFillCall2)"/>
        <rect x="13" y="15" width="204" height="44" rx="12" fill="url(#fillGradCall2)" filter="url(#roughFillCall2)"/>
        <rect x="26" y="22" width="150" height="7" rx="3.5" fill="#EDB307" opacity="0.18" filter="url(#roughFillCall2)"/>
      </svg>
      <span class="brush-label">
        <svg class="mini-icon" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="phoneGrad2" x1="0" y1="0" x2="0.7" y2="1">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="55%" stop-color="#F2F2F2"/>
              <stop offset="100%" stop-color="#CFCFCF"/>
            </linearGradient>
          </defs>
          <path d="M15 6.5c-3.1 0-5.6 2.6-5.1 5.6 1.3 8.6 5.6 16.8 12.2 23.4 6.6 6.6 14.8 10.9 23.4 12.2 3 .5 5.6-2 5.6-5.1v-4.9c0-2.1-1.4-3.9-3.4-4.4l-7-1.7c-1.7-.4-3.4.2-4.4 1.6l-1.9 2.5a26.6 26.6 0 0 1-12.9-12.9l2.5-1.9c1.4-1 2-2.7 1.6-4.4l-1.7-7c-.5-2-2.3-3.4-4.4-3.4H15Z" fill="url(#phoneGrad2)"/>
        </svg>
        התקשרו עכשיו
      </span>
    </a>

    <a href="index.html" class="btn-brush fill" aria-label="חזרה לעמוד הבית">
      <svg class="brush-bg" viewBox="0 0 230 76" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="roughFill3" x="-30%" y="-60%" width="160%" height="220%">
            <feTurbulence type="fractalNoise" baseFrequency="0.023 0.095" numOctaves="2" seed="7" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <linearGradient id="fillGrad3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F6C25F"/>
            <stop offset="55%" stop-color="#EDB307"/>
            <stop offset="100%" stop-color="#A6720A"/>
          </linearGradient>
        </defs>
        <rect x="16" y="28" width="198" height="20" rx="9" fill="#7A5306" opacity="0.5" filter="url(#roughFill3)"/>
        <rect x="13" y="15" width="204" height="44" rx="12" fill="url(#fillGrad3)" filter="url(#roughFill3)"/>
        <rect x="26" y="22" width="150" height="7" rx="3.5" fill="#FFE9B0" opacity="0.35" filter="url(#roughFill3)"/>
      </svg>
      <span class="brush-label">חזרה לעמוד הבית</span>
    </a>
  </div>

</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var name = params.get('name');
  if(name){
    document.getElementById('nameSpan').textContent = ', ' + name;
  }
</script>

</body>
</html>
